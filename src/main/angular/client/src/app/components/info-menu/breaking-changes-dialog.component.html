<div class="modal-body p-a-md">
  <div class="row">
    <div class="col-sm-12">
      <h3 class="m-t-0 m-b-md">
        <i class="fa fa-exclamation-triangle text-warning m-r-sm"></i>
        {{'info.label.breakingChanges' | translate: {version: modalData.version} }}
      </h3>
      <p class="m-b-md breaking-changes-intro">{{'info.message.breakingChanges' | translate}}</p>
      <div class="breaking-changes-list">
        @for (change of modalData.changes; track change.issue) {
          <div class="b-a r-sm p-a-sm m-b-sm">
            <a class="text-primary text-u-l _600" [href]="changeManagementUrl + change.issue" target="_blank"
               rel="noopener noreferrer">
              {{change.issue}}
              <i class="fa fa-external-link m-l-xs"></i>
            </a>
            <div class="m-t-xs breaking-changes-title">{{change.title}}</div>
          </div>
        }
      </div>
      <div class="m-t-md">
        <button (click)="onSubmit('GOTIT')" class="btn btn-grey btn-sm m-r-12" type="button">
          {{ 'info.button.gotIt' | translate }}
        </button>
        <button (click)="onSubmit('REMINDMELATER')" class="btn btn-grey btn-sm" type="button">
          {{ 'info.button.remindMeLater' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
